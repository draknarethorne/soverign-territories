name: Validate Schemas

on:
  push:
    paths:
      - 'docs/specs/*.json'
  pull_request:
    paths:
      - 'docs/specs/*.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install -g ajv-cli json-schema-to-typescript
      - name: Validate schemas
        run: |
          ajv validate -s docs/specs/card-schema.json -d docs/specs/card-schema.json
          ajv validate -s docs/specs/map-schema.json -d docs/specs/map-schema.json
          ajv validate -s docs/specs/player-schema.json -d docs/specs/player-schema.json
          ajv validate -s docs/specs/alliance-schema.json -d docs/specs/alliance-schema.json
          ajv validate -s docs/specs/ability-schema.json -d docs/specs/ability-schema.json
          ajv validate -s docs/specs/resource-schema.json -d docs/specs/resource-schema.json
          ajv validate -s docs/specs/trade-schema.json -d docs/specs/trade-schema.json
          ajv validate -s docs/specs/event-schema.json -d docs/specs/event-schema.json
          ajv validate -s docs/specs/progression-schema.json -d docs/specs/progression-schema.json
          ajv validate -s docs/specs/deck-schema.json -d docs/specs/deck-schema.json
          ajv validate -s docs/specs/deployment-schema.json -d docs/specs/deployment-schema.json
          ajv validate -s docs/specs/pack-schema.json -d docs/specs/pack-schema.json
          ajv validate -s docs/specs/tactic-schema.json -d docs/specs/tactic-schema.json
          ajv validate -s docs/specs/equipment-schema.json -d docs/specs/equipment-schema.json
          ajv validate -s docs/specs/theme-schema.json -d docs/specs/theme-schema.json
          ajv validate -s docs/specs/matchmaking-schema.json -d docs/specs/matchmaking-schema.json
          ajv validate -s docs/specs/starter-deck-schema.json -d docs/specs/starter-deck-schema.json
          ajv validate -s docs/specs/tutorial-schema.json -d docs/specs/tutorial-schema.json
          ajv validate -s docs/specs/notification-schema.json -d docs/specs/notification-schema.json
          ajv validate -s docs/specs/diplomacy-schema.json -d docs/specs/diplomacy-schema.json
          ajv validate -s docs/specs/achievement-schema.json -d docs/specs/achievement-schema.json
          ajv validate -s docs/specs/quest-schema.json -d docs/specs/quest-schema.json
          ajv validate -s docs/specs/reward-schema.json -d docs/specs/reward-schema.json
          ajv validate -s docs/specs/battle-schema.json -d docs/specs/battle-schema.json
          ajv validate -s docs/specs/ui-schema.json -d docs/specs/ui-schema.json
          ajv validate -s docs/specs/expedition-schema.json -d docs/specs/expedition-schema.json
          ajv validate -s docs/specs/campaign-schema.json -d docs/specs/campaign-schema.json
          ajv validate -s docs/specs/leaderboard-schema.json -d docs/specs/leaderboard-schema.json
      - name: Generate TypeScript types
        run: |
          json2ts docs/specs/card-schema.json > docs/specs/card-schema.d.ts
          json2ts docs/specs/map-schema.json > docs/specs/map-schema.d.ts
          json2ts docs/specs/player-schema.json > docs/specs/player-schema.d.ts
          json2ts docs/specs/alliance-schema.json > docs/specs/alliance-schema.d.ts
          json2ts docs/specs/ability-schema.json > docs/specs/ability-schema.d.ts
          json2ts docs/specs/resource-schema.json > docs/specs/resource-schema.d.ts
          json2ts docs/specs/trade-schema.json > docs/specs/trade-schema.d.ts
          json2ts docs/specs/event-schema.json > docs/specs/event-schema.d.ts
          json2ts docs/specs/progression-schema.json > docs/specs/progression-schema.d.ts
          json2ts docs/specs/deck-schema.json > docs/specs/deck-schema.d.ts
          json2ts docs/specs/deployment-schema.json > docs/specs/deployment-schema.d.ts
          json2ts docs/specs/pack-schema.json > docs/specs/pack-schema.d.ts
          json2ts docs/specs/tactic-schema.json > docs/specs/tactic-schema.d.ts
          json2ts docs/specs/equipment-schema.json > docs/specs/equipment-schema.d.ts
          json2ts docs/specs/theme-schema.json > docs/specs/theme-schema.d.ts
          json2ts docs/specs/matchmaking-schema.json > docs/specs/matchmaking-schema.d.ts
          json2ts docs/specs/starter-deck-schema.json > docs/specs/starter-deck-schema.d.ts
          json2ts docs/specs/tutorial-schema.json > docs/specs/tutorial-schema.d.ts
          json2ts docs/specs/notification-schema.json > docs/specs/notification-schema.d.ts
          json2ts docs/specs/diplomacy-schema.json > docs/specs/diplomacy-schema.d.ts
          json2ts docs/specs/achievement-schema.json > docs/specs/achievement-schema.d.ts
          json2ts docs/specs/quest-schema.json > docs/specs/quest-schema.d.ts
          json2ts docs/specs/reward-schema.json > docs/specs/reward-schema.d.ts
          json2ts docs/specs/battle-schema.json > docs/specs/battle-schema.d.ts
          json2ts docs/specs/ui-schema.json > docs/specs/ui-schema.d.ts
          json2ts docs/specs/expedition-schema.json > docs/specs/expedition-schema.d.ts
          json2ts docs/specs/campaign-schema.json > docs/specs/campaign-schema.d.ts
          json2ts docs/specs/leaderboard-schema.json > docs/specs/leaderboard-schema.d.ts
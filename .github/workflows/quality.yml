name: Quality Gates

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pre-commit==4.6.1

      - name: Install PowerShell analyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run pre-commit quality gates
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run dependency-selected tests (full on main or explicit dispatch)
        shell: cmd
        run: bin\validate.cmd --ci

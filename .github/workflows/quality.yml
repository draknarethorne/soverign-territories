name: Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python quality tools
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Install PowerShell analyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Install schema validation tools
        run: npm install -g ajv-cli json-schema-to-typescript

      - name: Run pre-commit quality gates
        run: pre-commit run --all-files --show-diff-on-failure

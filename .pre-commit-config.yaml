minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ".*\\.md$"

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]
        files: "\\.md$"

  - repo: local
    hooks:
      - id: powershell-analysis
        name: PowerShell PSScriptAnalyzer
        entry: powershell.exe
        args:
          - -NoProfile
          - -ExecutionPolicy
          - Bypass
          - -File
          - scripts/Invoke-QualityChecks.ps1
        language: system
        files: \.(ps1|psm1|psd1)$
        pass_filenames: false

      - id: validate-data
        name: Validate data (schemas + card<->art links)
        entry: python tools/validators/validate_data.py
        language: python
        additional_dependencies: [jsonschema]
        pass_filenames: false
        files: ^(data/|tools/validators/)
        stages: [pre-commit, pre-push]

      - id: validate-data-selftest
        name: Validator self-test (mutation tests)
        entry: python tools/validators/test_validate_data.py
        language: python
        additional_dependencies: [jsonschema]
        pass_filenames: false
        files: ^(tools/validators/|data/schemas/codex-schema\.json|data/art/_schema/)
        stages: [pre-commit, pre-push]

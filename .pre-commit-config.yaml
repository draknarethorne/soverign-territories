minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        exclude: "^workflows/_archive/"
      - id: trailing-whitespace
        exclude: ".*\\.md$"

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]
        files: "\\.md$"

  - repo: local
    hooks:
      - id: powershell-analysis
        name: PowerShell PSScriptAnalyzer
        entry: powershell.exe
        args:
          - -NoProfile
          - -ExecutionPolicy
          - Bypass
          - -File
          - scripts/Invoke-QualityChecks.ps1
        language: system
        files: \.(ps1|psm1|psd1)$
        pass_filenames: false

      - id: validate-data
        name: Validate data (schemas + card<->art links)
        entry: python tools/validators/validate_data.py
        language: python
        additional_dependencies: [jsonschema]
        pass_filenames: false
        files: ^(data/|tools/validators/)
        stages: [pre-commit, pre-push]

      - id: validate-data-selftest
        name: Validator self-test (isolated mutation tests)
        entry: python tools/validators/test_validate_data.py --isolated
        language: python
        additional_dependencies: [jsonschema]
        pass_filenames: false
        files: ^(tools/validators/|data/schemas/codex-schema\.json|data/art/_schema/)
        stages: [pre-commit, pre-push]

      - id: workflow-tool-tests
        name: Workflow tool tests (homes, accepts and zz_ guards)
        entry: python tools/workflows/test_comfy_workflows.py
        language: python
        additional_dependencies: [jsonschema]
        pass_filenames: false
        files: ^tools/workflows/
        stages: [pre-commit, pre-push]

      - id: backdrop-tests
        name: Backdrop wording rewrite tests
        entry: python -m unittest tools.workflows.test_backdrop
        language: python
        additional_dependencies: [jsonschema]
        pass_filenames: false
        files: ^(tools/workflows/(test_)?backdrop\.py|bin/backdrop\.cmd|data/art/backgrounds/studio/grey-even\.json)$

      - id: reference-rendering-tests
        name: Reference-rendering request, execution, gallery, outputs and comparison tests
        entry: python -m unittest tools.workflows.test_reference_rendering tools.workflows.test_reference_execution tools.workflows.test_reference_gallery tools.workflows.test_reference_outputs tools.workflows.test_reference_comparison
        language: python
        additional_dependencies: [jsonschema, pillow, numpy, opencv-python-headless]
        pass_filenames: false
        files: ^(tools/workflows/(reference_(rendering|execution|gallery|outputs|comparison)|test_reference_(rendering|execution|gallery|outputs|comparison))\.py|data/schemas/reference-render-request\.schema\.json|bin/render-(reference|gallery)\.cmd)$
        stages: [pre-commit, pre-push]

      - id: generator-tests
        name: Generator tests (piece extends)
        entry: python -m unittest tools.generators.test_gen_prompt_extends tools.generators.test_deluxe_reference
        language: python
        pass_filenames: false
        files: ^tools/generators/
        stages: [pre-commit, pre-push]

      - id: validator-isolation-tests
        name: Validator isolation and Alpha piece-stage tests
        entry: python -m unittest tools.validators.test_validation_isolation
        language: python
        additional_dependencies: [jsonschema]
        pass_filenames: false
        files: ^(tools/validators/(test_validate_data|test_validation_isolation)\.py|data/art/_schema/art-piece\.schema\.json|bin/validate\.cmd)$
        stages: [pre-commit, pre-push]

      - id: likeness-metadata-tests
        name: Likeness library tests
        entry: python -m unittest discover -s tools/art/likeness_library/tests -p test_*.py
        language: python
        additional_dependencies: [jsonschema, numpy, pillow]
        pass_filenames: false
        files: ^(tools/art/likeness_library/|data/art/_schema/likeness-(library|engine-policy)\.schema\.json$|data/art/likeness-(library|engine-policy)\.json$)
        stages: [pre-commit, pre-push]

      - id: codex-audit-tests
        name: Codex roster audit tests
        entry: python tools/art/audits/tests/test_codex_drift.py
        language: python
        pass_filenames: false
        files: ^(tools/art/audits/|docs/codex/heroes/|data/cards/sovereign-dawn/|data/art/(heroes|dragons)/)
        stages: [pre-commit, pre-push]
